# ninfer-metal (miv-v0.01) — Default 1-Click Shared Configuration
#
# Shared automatically by BOTH:
#   1. Standalone `ninfer-metal-serve` (and `./omlx-extend/scripts/start_ninfer_serve.sh`)
#   2. `oMLX-extend` (`m5_sidecar.py` -> `mseries_backendd`)
#
# Auto-discovery precedence (first existing file wins):
#   1. $NINFER_METAL_CONFIG
#   2. ./ninfer-metal.toml
#   3. ~/.config/ninfer-metal/ninfer-metal.toml
#   4. ~/Library/Application Support/oMLX/Providers/io.ninfer.metal/current/config/ninfer-metal.toml
#   5. <exe_dir>/../config/ninfer-metal.toml
#   6. <repo_root>/omlx-extend/config/ninfer-metal.toml
#
# Override precedence:
#   - Standalone: CLI flags > ninfer-metal.toml > compiled defaults
#   - oMLX-extend: Per-model UI settings > [sidecar.models."<name>"] > [engine]/[speculative] > fallback
#
# See `ninfer-metal.toml.example` for full commented options & [[models]] multi-model examples.

[server]
host = "127.0.0.1"
port = 8080
cors = true
providers_dir = ["~/Library/Application Support/oMLX/Providers"]

[engine]
max_concurrency = 4
max_context = 65536
kv_dtype = "affine4_g128"
rolling_prefix_cache = true
prefix_cache_gb = 4.0
sampling_contract = "legacy_rejection_v1"

[speculative]
# "auto" enables dflash2 if a companion dflash2/ artifact exists,
# else mtp if mtp.omlxm5 or embedded MTP weights exist, else none.
backend = "auto"
# 0 = automatic depth tuned for the detected backend & silicon profile.
draft_tokens = 0

[sidecar]
# Prefer in-process miv mainline in standalone mode and io.ninfer.metal in oMLX-extend.
prefer_inproc_miv = true

# Optional per-model sidecar overrides (keyed by oMLX model_id):
# [sidecar.models."Qwen3.8-27B-oQ4e-mtp"]
# max_concurrency = 4
# max_context = 131072
# kv_dtype = "affine4_g128"
# prefix_cache_gb = 8.0
